# Eval set: labelled by hand in evals/labels/<id>.md, run with `python -m evals.run`.
# Other teams' repos are anonymised here (Repo A, Repo B...); their URLs live in the
# gitignored evals/private/repos.yaml as `<id>: <url>`. Public and our own repos are named.
repos:
  - {id: own,                kind: own,     name: DurgaPritam/neatHack-QBITS-, url: https://github.com/DurgaPritam/neatHack-QBITS-}
  - {id: swarm,              kind: public,  name: openai/swarm, url: https://github.com/openai/swarm}
  - {id: smolagents,         kind: public,  name: huggingface/smolagents, url: https://github.com/huggingface/smolagents}
  - {id: open-deep-research, kind: public,  name: langchain-ai/open_deep_research, url: https://github.com/langchain-ai/open_deep_research}
  - {id: repo-a, kind: neathack, name: Repo A}   # provided by the team
  - {id: repo-b, kind: neathack, name: Repo B}   # provided by the team
  - {id: repo-c, kind: neathack, name: Repo C}   # provided by the team
  - {id: repo-d, kind: neathack, name: Repo D}   # audited in production, commits inside the window
  - {id: repo-e, kind: neathack, name: Repo E}   # audited in production, commits inside the window
